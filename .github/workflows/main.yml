name: Borsa Verileri

on:
  schedule:
    - cron: "40 15 * * *"      # 15:40 UTC = 18:40 Türkiye saati
  workflow_dispatch:           # elle "Run workflow" düğmesi

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests gspread playwright
      - run: playwright install --with-deps chromium
      - run: python borsa.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
