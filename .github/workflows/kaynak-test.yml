name: Kaynak testi

on:
  workflow_dispatch:
    inputs:
      adres:
        description: 'Dosya adresi https://www.borsaistanbul.com/datum/tophacmiksoz.zip'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Dosyayı incele
        env:
          ADRES: ${{ github.event.inputs.adres }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python kaynak_test.py "$ADRES"
